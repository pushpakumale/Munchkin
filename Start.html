<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>For My Munchkin ❤️</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&family=Dancing+Script:wght@700&display=swap" rel="stylesheet">

<link rel="stylesheet" href="style.css">

</head>

<body>

<div id="particles"></div>

<div class="floating-hearts">

<span>❤️</span>
<span>💖</span>
<span>💕</span>
<span>💗</span>
<span>💝</span>
<span>🌸</span>
<span>✨</span>

</div>

<div class="container">

<div class="glass">

<h2 class="small-title">
A tiny little place on the internet...
</h2>

<h1 class="main-title">
Hi Sweetu ❤️
</h1>

<p class="description">

I made something for you.

<br><br>

Not because I expect anything...

<br><br>

But because I wanted to see you smile today.

</p>

<button id="startButton">

✨ Enter ✨

</button>

<p class="footer">

Made with lots of care ❤️

</p>

</div>

</div>

<!-- Hidden Secret -->

<div id="secret">

<div class="secret-card">

<h2>🌸 Secret 🌸</h2>

<p>

If you found this...

You're adorable.

😊

</p>

<button id="closeSecret">

Close

</button>

</div>

</div>

<script src="script.js"></script>

</body>
</html>
