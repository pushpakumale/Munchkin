<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>One Last Thing ❤️</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&family=Dancing+Script:wght@700&display=swap" rel="stylesheet">


<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
}


body{

height:100vh;

overflow:hidden;

font-family:'Poppins',sans-serif;

background:
linear-gradient(
180deg,
#020617,
#0f172a,
#1e293b
);

display:flex;

justify-content:center;

align-items:center;

color:white;

}


/* Stars */

.star{

position:absolute;

color:white;

animation:twinkle 3s infinite;

}


@keyframes twinkle{

0%,100%{

opacity:.2;

}

50%{

opacity:1;

}

}



/* Main */

.container{

width:90%;

max-width:750px;

text-align:center;

z-index:2;

}



.card{

background:
rgba(255,255,255,.08);

backdrop-filter:blur(15px);

border-radius:30px;

padding:45px;

border:1px solid rgba(255,255,255,.2);

box-shadow:
0 20px 60px rgba(0,0,0,.5);

animation:fade 2s;

}



h1{

font-family:'Dancing Script',cursive;

font-size:65px;

color:#ffd6e8;

margin-bottom:30px;

}



#message{

font-size:20px;

line-height:2;

min-height:280px;

color:#f8fafc;

}



button{

display:none;

margin-top:30px;

padding:16px 45px;

border:none;

border-radius:50px;

background:#ff5b95;

color:white;

font-size:18px;

cursor:pointer;

transition:.4s;

}



button:hover{

transform:scale(1.1);

box-shadow:
0 10px 30px rgba(255,90,150,.5);

}



@keyframes fade{

from{

opacity:0;

transform:translateY(40px);

}

to{

opacity:1;

transform:translateY(0);

}

}



/* Hearts */

.heart{

position:absolute;

font-size:25px;

animation:rise 5s linear forwards;

}


@keyframes rise{

from{

transform:translateY(100vh);

opacity:1;

}

to{

transform:translateY(-120vh);

opacity:0;

}

}



</style>


</head>


<body>



<div class="container">


<div class="card">


<h1>
One Last Thing ❤️
</h1>


<div id="message"></div>


<button id="finish">

🌸 Close With A Smile

</button>


</div>


</div>




<script>


const text=`You reached the end...

So I just wanted to say one last thing.

I know life gets busy.

I know everyone has their own battles,
their own responsibilities,
and their own tiring days.

I don't expect anything from you.

Not a reply.

Not an explanation.

Not anything you don't want to give.

I just wanted to create a tiny little place
where you could spend a few minutes smiling.

I hope you take care of yourself.

Eat properly.

Rest when you need to.

Don't forget that your happiness matters too.

And whenever life feels a little heavy...

I hope you remember that someone is quietly wishing good things for you.

Thank you for being you.

Keep smiling, Munchkin ❤️`;


let i=0;

const box=document.getElementById("message");

const button=document.getElementById("finish");



function typeWriter(){


if(i<text.length){


box.innerHTML+=text.charAt(i);


i++;


setTimeout(typeWriter,45);


}

else{


button.style.display="inline-block";


}

}



function createStars(){


for(let i=0;i<120;i++){


let star=document.createElement("div");


star.className="star";


star.innerHTML="✨";


star.style.left=Math.random()*100+"vw";


star.style.top=Math.random()*100+"vh";


star.style.fontSize=
(5+Math.random()*15)+"px";


star.style.animationDelay=
Math.random()*3+"s";


document.body.appendChild(star);


}


}



function heartRain(){


for(let i=0;i<150;i++){


setTimeout(()=>{


let heart=document.createElement("div");


heart.className="heart";


heart.innerHTML=[
"❤️",
"💖",
"🌸",
"✨"
]
[Math.floor(Math.random()*4)];


heart.style.left=
Math.random()*100+"vw";


heart.style.fontSize=
(20+Math.random()*25)+"px";


document.body.appendChild(heart);



setTimeout(()=>{

heart.remove();

},5000);



},i*20);


}


}



button.onclick=function(){


heartRain();


button.innerHTML=
"Mission Complete ❤️";


button.disabled=true;


}



createStars();

setTimeout(typeWriter,1000);


</script>



</body>

</html>
