<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Catch The Hearts ❤️</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&family=Dancing+Script:wght@700&display=swap" rel="stylesheet">


<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
}


body{

height:100vh;

overflow:hidden;

font-family:'Poppins',sans-serif;

background:
linear-gradient(
135deg,
#ffd6e8,
#fff5fa,
#ffc8dc
);

display:flex;

justify-content:center;

align-items:center;

}


.game-container{

text-align:center;

width:90%;

max-width:600px;

}


.card{

background:rgba(255,255,255,.75);

backdrop-filter:blur(15px);

padding:40px;

border-radius:30px;

box-shadow:
0 15px 40px rgba(0,0,0,.15);

}


h1{

font-family:'Dancing Script',cursive;

font-size:60px;

color:#ff4d88;

}


p{

margin:20px 0;

font-size:18px;

color:#555;

}


.score{

font-size:25px;

font-weight:600;

color:#ff4d88;

}


.heart{

position:absolute;

font-size:35px;

cursor:pointer;

animation:fall linear;

user-select:none;

}


@keyframes fall{

from{

transform:translateY(-100px);

opacity:1;

}


to{

transform:translateY(110vh);

opacity:0;

}

}



button{

margin-top:25px;

padding:15px 35px;

border:none;

border-radius:40px;

background:#ff5b95;

color:white;

font-size:18px;

cursor:pointer;

transition:.3s;

}


button:hover{

transform:scale(1.08);

}


#success{

display:none;

position:fixed;

top:0;

left:0;

height:100%;

width:100%;

background:
rgba(255,255,255,.95);

justify-content:center;

align-items:center;

flex-direction:column;

text-align:center;

z-index:10;

}


#success h2{

font-family:'Dancing Script',cursive;

font-size:65px;

color:#ff4d88;

}


#success p{

max-width:500px;

font-size:22px;

}



.confetti{

position:absolute;

font-size:25px;

animation:explode 2s forwards;

}


@keyframes explode{

from{

transform:scale(1);

opacity:1;

}

to{

transform:
translateY(-300px)
rotate(360deg);

opacity:0;

}

}


</style>

</head>


<body>


<div class="game-container">


<div class="card">


<h1>
Catch Hearts ❤️
</h1>


<p>

A tiny little game...

Catch 20 hearts to unlock your surprise.

🌸

</p>


<div class="score">

Hearts Collected:
<span id="score">0</span>/20

</div>


<button onclick="startGame()">

Start Game ✨

</button>


</div>


</div>



<div id="success">


<h2>
You did it ❤️
</h2>


<p>

You collected enough hearts...

But here's the real surprise:

Someone hopes you always have reasons to smile.

🌸

</p>


<button onclick="continueNext()">

Continue ✨

</button>


</div>



<script>


let score=0;

let playing=false;


function startGame(){

if(playing)return;

playing=true;

createHeart();

}



function createHeart(){

if(!playing)return;


let heart=document.createElement("div");


heart.className="heart";


heart.innerHTML=[
"❤️",
"💖",
"💕",
"🌸"
]
[Math.floor(Math.random()*4)];


heart.style.left=
Math.random()*90+"vw";


heart.style.animationDuration=
(3+Math.random()*3)+"s";


document.body.appendChild(heart);



heart.onclick=function(){


score++;


document.getElementById("score").innerHTML=score;


heart.remove();


if(score>=20){

finishGame();

}

};



setTimeout(()=>{

heart.remove();

},6000);



setTimeout(createHeart,600);

}



function finishGame(){

playing=false;


document.querySelectorAll(".heart")
.forEach(h=>h.remove());


document.getElementById("success")
.style.display="flex";


celebrate();

}



function celebrate(){


for(let i=0;i<100;i++){


let item=document.createElement("div");


item.className="confetti";


item.innerHTML=[
"❤️",
"✨",
"🌸",
"💖"
]
[Math.floor(Math.random()*4)];


item.style.left=
Math.random()*100+"vw";


item.style.top=
"50%";


document.body.appendChild(item);


setTimeout(()=>{

item.remove();

},2000);


}


}



function continueNext(){

window.location.href="memory.html";

}


</script>


</body>

</html>
