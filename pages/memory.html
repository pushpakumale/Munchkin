<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Memory Jar ❤️</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&family=Dancing+Script:wght@700&display=swap" rel="stylesheet">


<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
}


body{

height:100vh;

overflow:hidden;

font-family:'Poppins',sans-serif;

background:
linear-gradient(
135deg,
#1e293b,
#334155,
#0f172a
);

display:flex;

justify-content:center;

align-items:center;

color:white;

}


/* Stars */

.star{

position:absolute;

font-size:15px;

animation:twinkle 3s infinite;

opacity:.6;

}


@keyframes twinkle{

0%,100%{
opacity:.2;
}

50%{
opacity:1;
}

}



.container{

width:90%;

max-width:650px;

text-align:center;

z-index:2;

}



.card{

background:rgba(255,255,255,.12);

backdrop-filter:blur(15px);

padding:45px;

border-radius:30px;

border:1px solid rgba(255,255,255,.25);

box-shadow:
0 20px 50px rgba(0,0,0,.3);

}



h1{

font-family:'Dancing Script',cursive;

font-size:60px;

color:#ffd6e8;

margin-bottom:20px;

}


p{

font-size:18px;

line-height:1.8;

color:#f8fafc;

}



.jar{

font-size:130px;

cursor:pointer;

margin:35px;

animation:bounce 3s infinite;

}



@keyframes bounce{

0%,100%{

transform:translateY(0);

}

50%{

transform:translateY(-15px);

}

}



.note{

display:none;

background:#fff7ed;

color:#444;

padding:25px;

border-radius:20px;

font-size:20px;

line-height:1.6;

animation:show .8s;

}



@keyframes show{

from{

opacity:0;

transform:scale(.5);

}

to{

opacity:1;

transform:scale(1);

}

}



button{

margin-top:30px;

padding:15px 35px;

border:none;

border-radius:40px;

background:#ff6b9d;

color:white;

font-size:18px;

cursor:pointer;

transition:.3s;

}


button:hover{

transform:scale(1.08);

}



</style>

</head>


<body>



<div class="container">


<div class="card">


<h1>
The Memory Jar 🫙
</h1>


<p>

Every little note inside this jar has one tiny wish for you.

Click the jar and see what appears.

✨

</p>



<div class="jar" onclick="openNote()">

🫙

</div>



<div class="note" id="note">

</div>


<button onclick="nextPage()">

One Last Surprise ❤️

</button>


</div>


</div>



<script>


const notes=[

"🌸 I hope your days are filled with little moments of happiness.",

"☕ I hope you take breaks when life gets too busy.",

"🌙 I hope you sleep peacefully after tiring days.",

"✨ I hope something unexpectedly beautiful happens today.",

"❤️ I hope you always remember how special you are.",

"🌷 I hope you never forget to smile.",

"🦋 I hope life is gentle with you.",

"💖 I hope you are proud of yourself.",

"🌸 I hope your dreams slowly become reality.",

"☀️ I hope tomorrow is kinder than today.",

"❤️ Someone out there genuinely wishes good things for you."

];


let used=[];


function openNote(){


if(used.length===notes.length){

used=[];

}


let index;


do{

index=Math.floor(Math.random()*notes.length);

}

while(used.includes(index));


used.push(index);


document.getElementById("note").style.display="block";


document.getElementById("note").innerHTML=
notes[index];


createStars();


}



function createStars(){


for(let i=0;i<5;i++){


let star=document.createElement("div");


star.className="star";


star.innerHTML="✨";


star.style.left=Math.random()*100+"vw";

star.style.top=Math.random()*100+"vh";


document.body.appendChild(star);


setTimeout(()=>{

star.remove();

},4000);


}


}



function nextPage(){

window.location.href="ending.html";

}



</script>


</body>

</html>
