<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>A Little Smile Garden 🌸</title>

<link rel="preconnect" href="https://fonts.googleapis.com">

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&family=Dancing+Script:wght@700&display=swap" rel="stylesheet">


<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
}


body{

height:100vh;

display:flex;

justify-content:center;

align-items:center;

background:linear-gradient(
135deg,
#ffe4ef,
#fff5fa,
#ffd6e8
);

overflow:hidden;

font-family:'Poppins',sans-serif;

}


.container{

width:90%;

max-width:600px;

text-align:center;

}


.card{

background:rgba(255,255,255,.7);

backdrop-filter:blur(15px);

padding:45px;

border-radius:30px;

box-shadow:
0 15px 40px rgba(0,0,0,.12);

animation:appear 1s;

}


h1{

font-family:'Dancing Script',cursive;

font-size:55px;

color:#ff4d88;

margin-bottom:20px;

}


p{

font-size:18px;

line-height:1.8;

color:#555;

}


.message-box{

margin-top:35px;

min-height:100px;

display:flex;

align-items:center;

justify-content:center;

font-size:22px;

font-weight:600;

color:#ff4d88;

padding:20px;

}


button{

margin-top:30px;

padding:15px 35px;

border:none;

border-radius:40px;

background:#ff5b95;

color:white;

font-size:18px;

cursor:pointer;

transition:.3s;

}


button:hover{

transform:scale(1.08);

box-shadow:
0 10px 25px rgba(255,90,150,.4);

}


.next{

background:#fff;

color:#ff4d88;

margin-left:10px;

}


/* Flowers */

.flower{

position:absolute;

font-size:30px;

animation:fall linear infinite;

}


@keyframes fall{


0%{

transform:
translateY(-10vh)
rotate(0deg);

opacity:0;

}


20%{

opacity:1;

}


100%{

transform:
translateY(110vh)
rotate(360deg);

opacity:0;

}


}


@keyframes appear{

from{

opacity:0;

transform:translateY(50px);

}

to{

opacity:1;

transform:translateY(0);

}

}


</style>

</head>


<body>


<div class="container">


<div class="card">


<h1>
A Little Smile Garden 🌸
</h1>


<p>

I planted a few tiny messages here.

Click the button and see what appears.

❤️

</p>



<div class="message-box" id="message">

✨ Click below ✨

</div>



<button onclick="showMessage()">

Open a Smile 🌸

</button>


<button class="next" onclick="nextPage()">

Continue ❤️

</button>


</div>


</div>



<script>


const messages=[

"Your smile probably makes someone's day better ❤️",

"Don't forget to take care of yourself 🌸",

"You are doing better than you think ✨",

"Even strong people need rest sometimes 🌙",

"I hope something makes you laugh today 😊",

"You deserve peaceful days ❤️",

"Drink water. Seriously. 😄",

"Don't let work steal all your happiness ☕",

"Someone is cheering for you quietly 💖",

"You are more special than you realize 🌷",

"Your happiness matters ❤️",

"May today bring you a small surprise ✨",

"Keep being the wonderful person you are 🌸",

"Sending a little smile your way 😊",

"I hope you feel proud of yourself today 💕"

];


function showMessage(){

let random=
messages[Math.floor(Math.random()*messages.length)];

document.getElementById("message").innerHTML=random;

createFlower();

}



function createFlower(){

let flower=document.createElement("div");

flower.className="flower";

flower.innerHTML=[
"🌸",
"🌺",
"✨",
"💖"
][Math.floor(Math.random()*4)];


flower.style.left=Math.random()*100+"vw";

flower.style.animationDuration=
(5+Math.random()*5)+"s";


document.body.appendChild(flower);


setTimeout(()=>{

flower.remove();

},10000);


}



function nextPage(){

window.location.href="game.html";

}



</script>


</body>

</html>
